<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Graduation Ceremony Image Generator</title>


<style>

/* ======================================================
   GENERAL
====================================================== */

* {
    box-sizing: border-box;
}


body {

    margin: 0;

    padding: 30px;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background: #f3f4f6;

    color: #222;
}


/* ======================================================
   MAIN CONTAINER
====================================================== */

.container {

    max-width: 1400px;

    margin: auto;

    display: grid;

    grid-template-columns: 350px 1fr;

    gap: 30px;

    align-items: start;
}


/* ======================================================
   FORM & PREVIEW BOX
====================================================== */

.form-box,
.preview-box {

    background: #fff;

    padding: 25px;

    border-radius: 12px;

    box-shadow:
        0 5px 20px rgba(0, 0, 0, .08);
}


/* ======================================================
   HEADINGS
====================================================== */

h1,
h2 {

    margin-top: 0;
}


/* ======================================================
   FORM
====================================================== */

.form-group {

    margin-bottom: 20px;
}


label {

    display: block;

    margin-bottom: 8px;

    font-weight: 600;
}


input,
select,
textarea,
button {

    width: 100%;

    padding: 12px;

    font-size: 15px;

    border-radius: 6px;
}


input,
select,
textarea {

    border: 1px solid #ccc;
}


textarea {

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    resize: vertical;

    min-height: 100px;
}


small {

    display: block;

    margin-top: 6px;

    color: #666;

    line-height: 1.4;
}


/* ======================================================
   BUTTON
====================================================== */

button {

    border: none;

    color: white;

    background: #1769e0;

    font-weight: bold;

    cursor: pointer;
}


button:hover {

    background: #0d55bd;
}


/* ======================================================
   DOWNLOAD BUTTON
====================================================== */

#downloadBtn {

    width: 100%;

    max-width: 1000px;

    margin-top: 15px;

    background: #198754;
}


#downloadBtn:hover {

    background: #146c43;
}


#downloadBtn:disabled {

    background: #aaa;

    cursor: not-allowed;
}


/* ======================================================
   PREVIEW BOX
====================================================== */

.preview-box {

    display: flex;

    flex-direction: column;

    align-items: center;
}


/* ======================================================
   PREVIEW CONTAINER
====================================================== */

.preview-container {

    width: 100%;

    max-width: 1000px;

    margin: 0 auto;

    background: #eee;

    border-radius: 8px;

    overflow: hidden;
}


/* ======================================================
   CANVAS
====================================================== */

canvas {

    display: block;

    width: 100%;

    height: auto;
}


/* ======================================================
   MESSAGE
====================================================== */

#message {

    margin-top: 15px;

    font-size: 14px;

    line-height: 1.5;
}


/* ======================================================
   CHARACTER COUNTER
====================================================== */

#charCount {

    font-weight: bold;
}


/* ======================================================
   RESPONSIVE
====================================================== */

@media (max-width: 900px) {

    .container {

        grid-template-columns: 1fr;

    }

}


@media (max-width: 600px) {

    body {

        padding: 15px;

    }


    .form-box,
    .preview-box {

        padding: 20px;

    }

}

</style>

</head>


<body>


<div class="container">


<!-- ==========================================
     STUDENT FORM
=========================================== -->

<div class="form-box">


    <h1>
        Graduation Ceremony Image Generator
    </h1>


    <p>
        Upload your photo and enter your details
        to generate your personalised image.
    </p>


    <form id="studentForm">


        <!-- ======================================
             PHOTO
        ======================================= -->

        <div class="form-group">

            <label for="photo">
                Student Photo
            </label>


            <input
                type="file"
                id="photo"
                accept="image/*"
                required
            >


            <small>
                Minimum image size: 400px × 400px
            </small>

        </div>


        <!-- ======================================
             NAME
        ======================================= -->

        <div class="form-group">

            <label for="name">
                Student Name
            </label>


            <input
                type="text"
                id="name"
                placeholder="Enter student name"
                required
            >

        </div>


        <!-- ======================================
             DEPARTMENT
        ======================================= -->

        <div class="form-group">

            <label for="department">
                Department
            </label>


            <select
                id="department"
                required>

                <option value="">
                    Select Department
                </option>


                <option value="Bachelor of Information Technology and Systems">
                    Bachelor of Information Technology and Systems
                </option>


                <option value="Master of Information Technology and Systems">
                    Master of Information Technology and Systems
                </option>


                <option value="Bachelor of Business">
                    Bachelor of Business
                </option>


                <option value="Master of Business Administration">
                    Master of Business Administration
                </option>

            </select>

        </div>


        <!-- ======================================
             DESCRIPTION
        ======================================= -->

        <div class="form-group">

            <label for="description">
                Quote/Description
            </label>


            <textarea
                id="description"
                maxlength="150"
                rows="4"
                placeholder="Enter Quote/Description (maximum 150 characters)"
                required
            ></textarea>


            <small>

                Maximum 150 characters.

                <span id="charCount">
                    0
                </span>/150

            </small>

        </div>


        <!-- ======================================
             GENERATE BUTTON
        ======================================= -->

        <button type="submit">

            Generate Image

        </button>


    </form>


    <div id="message"></div>


</div>



<!-- ==========================================
     GENERATED IMAGE PREVIEW
=========================================== -->

<div class="preview-box">


    <h2>
        Generated Image Preview
    </h2>


    <div class="preview-container">


        <canvas
            id="canvas"
            width="1920"
            height="1080">
        </canvas>


    </div>


    <!-- ======================================
         DOWNLOAD
    ======================================= -->

    <button
        id="downloadBtn"
        disabled>

        Download Generated Image

    </button>


</div>


</div>



<script>


// ======================================================
// CANVAS
// ======================================================

const canvas =
    document.getElementById(
        "canvas"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


const CANVAS_WIDTH =
    1920;


const CANVAS_HEIGHT =
    1080;



// ======================================================
// BACKGROUND IMAGE
// ======================================================

const background =
    new Image();


background.src =
    "background.jpg";


background.onload =
    function() {

        ctx.drawImage(

            background,

            0,

            0,

            CANVAS_WIDTH,

            CANVAS_HEIGHT

        );

    };



// ======================================================
// FORM ELEMENTS
// ======================================================

const form =
    document.getElementById(
        "studentForm"
    );


const photoInput =
    document.getElementById(
        "photo"
    );


const nameInput =
    document.getElementById(
        "name"
    );


const departmentInput =
    document.getElementById(
        "department"
    );


const descriptionInput =
    document.getElementById(
        "description"
    );


const charCount =
    document.getElementById(
        "charCount"
    );


const downloadBtn =
    document.getElementById(
        "downloadBtn"
    );


const message =
    document.getElementById(
        "message"
    );



// ======================================================
// CHARACTER COUNTER
// ======================================================

descriptionInput.addEventListener(

    "input",

    function() {

        charCount.textContent =
            descriptionInput.value.length;

    }

);



// ======================================================
// FORM SUBMISSION
// ======================================================

form.addEventListener(

    "submit",

    function(event) {


        event.preventDefault();


        // ----------------------------------------------
        // GET FORM VALUES
        // ----------------------------------------------

        const file =
            photoInput.files[0];


        const studentName =
            nameInput.value.trim();


        const department =
            departmentInput.value;


        const description =
            descriptionInput.value.trim();



        // ----------------------------------------------
        // VALIDATION
        // ----------------------------------------------

        if (!file) {

            alert(
                "Please upload a student photo."
            );

            return;

        }


        if (!studentName) {

            alert(
                "Please enter the student's name."
            );

            return;

        }


        if (!department) {

            alert(
                "Please select a department."
            );

            return;

        }


        if (!description) {

            alert(
                "Please enter a description."
            );

            return;

        }


        if (description.length > 150) {

            alert(
                "The description must not exceed 150 characters."
            );

            return;

        }



        // ----------------------------------------------
        // READ IMAGE
        // ----------------------------------------------

        const reader =
            new FileReader();


        reader.onload =
            function(event) {


                const studentPhoto =
                    new Image();


                studentPhoto.onload =
                    function() {


                        // ==================================
                        // MINIMUM IMAGE SIZE
                        // ==================================

                        if (

                            studentPhoto.width < 400 ||

                            studentPhoto.height < 400

                        ) {

                            alert(

                                "The uploaded image must " +

                                "have a minimum dimension " +

                                "of 400px."

                            );

                            return;

                        }



                        // ==================================
                        // GENERATE IMAGE
                        // ==================================

                        generateImage(

                            studentPhoto,

                            studentName,

                            department,

                            description

                        );

                    };


                studentPhoto.src =
                    event.target.result;

            };


        reader.readAsDataURL(
            file
        );

    }

);



// ======================================================
// GENERATE FINAL IMAGE
// ======================================================

function generateImage(

    studentPhoto,

    studentName,

    department,

    description

) {


    // ==============================================
    // CLEAR CANVAS
    // ==============================================

    ctx.clearRect(

        0,

        0,

        CANVAS_WIDTH,

        CANVAS_HEIGHT

    );



    // ==============================================
    // BACKGROUND
    // ==============================================

    ctx.drawImage(

        background,

        0,

        0,

        CANVAS_WIDTH,

        CANVAS_HEIGHT

    );



    // ==============================================
    // PHOTO
    // ==============================================

    const photoX =
        135;


    const photoY =
        620;


    const photoWidth =
        300;


    const photoHeight =
        350;


    drawPhoto3x4(

        studentPhoto,

        photoX,

        photoY,

        photoWidth,

        photoHeight

    );



    // ==============================================
    // STUDENT NAME
    // ==============================================

    const nameX =
        130;


    const nameY =
        530;


    ctx.save();


    ctx.font =
        "bold 54px Arial";


    ctx.fillStyle =
        "#000000";


    ctx.textAlign =
        "left";


    ctx.textBaseline =
        "middle";


    ctx.fillText(

        studentName,

        nameX,

        nameY

    );


    ctx.restore();



    // ==============================================
    // DEPARTMENT
    // ==============================================

    const departmentX =
        135;


    const departmentY =
        400;


    ctx.save();


    ctx.font =
        "bold 42px Arial";


    ctx.fillStyle =
        "#000000";


    ctx.textAlign =
        "left";


    ctx.textBaseline =
        "middle";


    ctx.fillText(

        department,

        departmentX,

        departmentY

    );


    ctx.restore();



    // ==============================================
    // DESCRIPTION — MAXIMUM 3 LINES
    // ==============================================

    const descriptionX =
        550;


    const descriptionY =
        760;


    const descriptionWidth =
        700;


    const descriptionLineHeight =
        50;


    ctx.save();


    ctx.font =
        "italic 32px Arial";


    ctx.fillStyle =
        "#000000";


    ctx.textAlign =
        "left";


    ctx.textBaseline =
        "middle";


    drawWrappedText(

        description,

        descriptionX,

        descriptionY,

        descriptionWidth,

        descriptionLineHeight,

        3

    );


    ctx.restore();



    // ==============================================
    // ENABLE DOWNLOAD
    // ==============================================

    downloadBtn.disabled =
        false;


    message.innerHTML =
        "✓ Image generated successfully. " +

        "Review the preview and download your image.";

}



// ======================================================
// CROP PHOTO WITHOUT DISTORTION
// ======================================================

function drawPhoto3x4(

    image,

    x,

    y,

    width,

    height

) {


    // ==============================================
    // TARGET RATIO
    // Use the ACTUAL display dimensions.
    // This keeps the image proportional.
    // ==============================================

    const targetRatio =
        width / height;


    const imageRatio =
        image.width /
        image.height;


    let sourceX =
        0;


    let sourceY =
        0;


    let sourceWidth =
        image.width;


    let sourceHeight =
        image.height;



    // ==============================================
    // IMAGE IS WIDER THAN TARGET
    // CROP LEFT AND RIGHT
    // ==============================================

    if (
        imageRatio >
        targetRatio
    ) {


        sourceWidth =
            image.height *
            targetRatio;


        sourceX =
            (
                image.width -
                sourceWidth
            ) / 2;

    }



    // ==============================================
    // IMAGE IS TALLER THAN TARGET
    // CROP TOP AND BOTTOM
    // ==============================================

    else if (
        imageRatio <
        targetRatio
    ) {


        sourceHeight =
            image.width /
            targetRatio;


        sourceY =
            (
                image.height -
                sourceHeight
            ) / 2;

    }



    // ==============================================
    // DRAW CROPPED PHOTO
    // NO STRETCHING OR DISTORTION
    // ==============================================

    ctx.drawImage(

        image,

        sourceX,

        sourceY,

        sourceWidth,

        sourceHeight,

        x,

        y,

        width,

        height

    );

}



// ======================================================
// WRAP TEXT INTO MAXIMUM 3 LINES
// ======================================================

function drawWrappedText(

    text,

    x,

    y,

    maxWidth,

    lineHeight,

    maxLines

) {


    const words =
        text.split(" ");


    const lines = [];


    let currentLine =
        "";



    // ==============================================
    // CREATE LINES
    // ==============================================

    for (

        let i = 0;

        i < words.length;

        i++

    ) {


        const testLine =
            currentLine

                ? currentLine +
                  " " +
                  words[i]

                : words[i];


        const testWidth =
            ctx.measureText(
                testLine
            ).width;



        if (

            testWidth <= maxWidth ||

            currentLine === ""

        ) {

            currentLine =
                testLine;

        }

        else {


            lines.push(
                currentLine
            );


            currentLine =
                words[i];

        }

    }



    if (currentLine) {

        lines.push(
            currentLine
        );

    }



    // ==============================================
    // LIMIT TO 3 LINES
    // ==============================================

    const visibleLines =
        lines.slice(
            0,
            maxLines
        );



    // ==============================================
    // VERTICAL CENTRE
    // ==============================================

    const totalHeight =
        (
            visibleLines.length -
            1
        ) *
        lineHeight;


    const startY =
        y -
        (
            totalHeight / 2
        );



    // ==============================================
    // DRAW EACH LINE
    // ==============================================

    visibleLines.forEach(

        function(line, index) {

            ctx.fillText(

                line,

                x,

                startY +
                (
                    index *
                    lineHeight
                )

            );

        }

    );

}



// ======================================================
// DOWNLOAD GENERATED IMAGE
// ======================================================

downloadBtn.addEventListener(

    "click",

    function() {


        /*
            Convert the generated canvas
            to a high-quality PNG.
        */

        const imageURL =
            canvas.toDataURL(

                "image/png",

                1.0

            );



        // ----------------------------------------------
        // CREATE DOWNLOAD LINK
        // ----------------------------------------------

        const link =
            document.createElement(
                "a"
            );


        link.href =
            imageURL;


        link.download =
            "student-image.png";



        // ----------------------------------------------
        // DOWNLOAD
        // ----------------------------------------------

        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );

    }

);

</script>


</body>

</html>
